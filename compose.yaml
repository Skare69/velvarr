services:
  velvarr:
    build: .
    image: velvarr:local
    restart: unless-stopped
    ports:
      # Loopback only: the app is never exposed to the network by default.
      - "127.0.0.1:6699:6699"
    env_file:
      # Runtime-only credentials, produced once by `npm run setup`; never baked into the image.
      - path: .env.local
        required: false
    environment:
      # Browse Velvarr or Jellyfin over plain HTTP on the LAN? Uncomment:
      # - VELVARR_ALLOW_HTTP=1
    volumes:
      - velvarr-data:/data

volumes:
  velvarr-data:
