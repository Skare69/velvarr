services:
  velvarr:
    # Pull-only deployment. To build from source instead, replace image with
    # "velvarr:local" and uncomment build.
    image: ghcr.io/skare69/velvarr:v0.17.0
    # build: .
    restart: unless-stopped
    ports:
      # Loopback only: the app is never exposed to the network by default.
      - "127.0.0.1:6699:6699"
    env_file:
      # Runtime-only credentials, produced once by `npm run setup`; never baked into the image.
      - path: .env.local
        required: false
    # Plain HTTP on the LAN (Velvarr origin or Jellyfin/Whisparr base URLs)?
    # Add an environment entry:  - VELVARR_ALLOW_HTTP=1
    # Optional. Without it everything works; with it, a Jellyfin item whose
    # title only nearly matches a requested record is judged "same work?" by
    # TypeSafe and lands in 'ambiguous — administrator review' instead of
    # silently counting as missing:  - TYPESAFE_API_KEY=ts_live_...
    volumes:
      - velvarr-data:/data

volumes:
  velvarr-data:
