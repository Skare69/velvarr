name: CI

on:
  push:
    branches: [main, feat/velvarr-implementation]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish branch-tagged image to GHCR (opt-in only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gates:
    name: Frozen install, format, audit, check, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - name: Dependency audit (bun.lock)
        run: bun audit
      - run: bun run check
      - run: bun run test
      - run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  container:
    name: Container smoke (build, readiness, restart)
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate compose file
        run: docker compose config -q
      - name: Build image
        run: docker build -t velvarr:ci .
      # /data at the image root is the volume mountpoint (created empty), not
      # build-context content; /app is where the context is copied and where a
      # leak would land. node_modules/.next are pruned: third-party packages
      # legitimately contain cache/config directories.
      - name: Assert image carries no env, config, data, or cache paths
        run: |
          leaked=$(docker run --rm --entrypoint /bin/sh velvarr:ci -c \
            'find /app -path /app/node_modules -prune -o -path /app/.next -prune -o \( -name ".env*" -o -name config -o -name data -o -name cache \) -print')
          if [ -n "$leaked" ]; then
            echo "credential or runtime-state paths leaked into the image:"
            echo "$leaked"
            exit 1
          fi
      - name: Run container with throwaway runtime secrets
        run: |
          docker run -d --name velvarr-smoke \
            -p 127.0.0.1:6699:6699 \
            -e "VELVARR_SECRET_KEY=$(openssl rand -hex 32)" \
            -e "VELVARR_SETUP_SECRET=$(openssl rand -hex 32)" \
            -v velvarr-smoke-data:/data \
            velvarr:ci
      - name: Readiness check
        run: |
          # /api/status reads storage: a /data the runtime user cannot write
          # (or a migration that throws) answers 500, so this fails the job.
          # /api/health is static and always 200. Any "startup failed" in the
          # logs fails too: the acquisition loop may be dead while /api/status
          # still answers.
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6699/api/status | grep -q '"initialized":'; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ] || docker logs velvarr-smoke 2>&1 | grep -q 'startup failed'; then
            docker logs --tail 100 velvarr-smoke
            exit 1
          fi
      # Next standalone output drops public/ unless the Dockerfile copies it —
      # a missing asset must fail the image, not the menu (v0.27.0 shipped a
      # broken logo this way).
      - name: Assert public assets serve from the image
        run: |
          ctype=$(curl -fsS -o /dev/null -w '%{content_type}' http://127.0.0.1:6699/velvarr-logo.png)
          if [ "$ctype" != "image/png" ]; then
            echo "public/ assets missing from the image (got: $ctype)"
            exit 1
          fi
      - name: Assert non-root runtime
        run: docker exec velvarr-smoke node -e "if (process.getuid() === 0) { console.error('container must not run as root'); process.exit(1) }"
      # One exec inside the container gathers every piece of evidence: the exec
      # identity, the deep find scan with its stderr inline, and write probes
      # on every directory the Dockerfile creates and on the code files. A
      # find error alone does not fail the job — the probes decide. The full
      # verdict also goes to the job summary, which is readable on the public
      # run page without a GitHub session; the step log is not (runs
      # 38287663285 and 38293705590 failed here with unreadable logs, and the
      # previous form captured find's stderr to a file it never printed).
      - name: Assert app code is not writable by the runtime user
        run: |
          verdict=$(docker exec velvarr-smoke sh -c '
            echo "exec user: uid=$(id -u) gid=$(id -g) groups=$(id -G | tr " " ",")"
            : > /tmp/ci-bad
            bad_find=$(find /app -writable 2>/tmp/ci-find.err); fexit=$?
            [ -n "$bad_find" ] && echo "$bad_find" >> /tmp/ci-bad
            [ -s /tmp/ci-find.err ] && { echo "find stderr:"; cat /tmp/ci-find.err; }
            for d in /app /app/.next /app/.next/static /app/public /app/node_modules; do
              [ -d "$d" ] || continue
              if touch "$d/.ci-wprobe" 2>/dev/null; then
                echo "probe wrote: $d" >> /tmp/ci-bad
                rm -f "$d/.ci-wprobe"
              fi
            done
            for f in /app/server.js /app/package.json; do
              if [ -f "$f" ] && [ -w "$f" ]; then
                echo "probe can write: $f" >> /tmp/ci-bad
              fi
            done
            if [ "$fexit" -ne 0 ]; then
              echo "note: deep scan exited $fexit; the probes decide"
            fi
            if [ -s /tmp/ci-bad ]; then
              echo "RUNTIME USER CAN WRITE:"
              cat /tmp/ci-bad
              echo "modes of the listed paths:"
              while IFS= read -r p; do stat -c "%A %u:%g %n" "$p" 2>/dev/null; done < /tmp/ci-bad
              exit 1
            fi
            echo "clean: no /app path is writable by the runtime user (deep scan exit $fexit)"
          ' 2>&1)
          status=$?
          echo "$verdict"
          if [ "$status" -ne 0 ] && [ -z "$verdict" ]; then
            echo "the docker exec itself failed: container dead or exec error"
          fi
          {
            echo "### Writable-app-code check"
            echo ""
            echo '```'
            echo "$verdict"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Restart and re-check readiness on persistent data
        run: |
          docker restart velvarr-smoke
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6699/api/status | grep -q '"initialized":'; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ] || docker logs velvarr-smoke 2>&1 | grep -q 'startup failed'; then
            docker logs --tail 100 velvarr-smoke
            exit 1
          fi
          docker rm -f velvarr-smoke
          docker volume rm velvarr-smoke-data

  publish:
    name: GHCR publication (release tags + opt-in)
    runs-on: ubuntu-latest
    needs: [gates, container]
    # Publish only on a v* tag push (the path release.mjs waits for) or an
    # opted-in dispatch from a branch ref. A dispatch on a tag ref never
    # publishes: a rebuild would push a new digest over the release's recorded
    # vX.Y.Z / latest tags (release.mjs reads the GHCR digest back).
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish == true && !startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
